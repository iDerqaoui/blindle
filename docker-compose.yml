# Base locale pour le développement : docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blindle
      POSTGRES_USER: blindle
      POSTGRES_PASSWORD: blindle
    ports:
      - "5432:5432"
    volumes:
      - blindle-db:/var/lib/postgresql/data

volumes:
  blindle-db:
