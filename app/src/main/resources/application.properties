spring.application.name=blindle
# Les hébergeurs (Render, Koyeb…) imposent le port via PORT.
server.port=${PORT:8080}
# Derrière un proxy HTTPS : respecter X-Forwarded-Proto/Host (même origine pour /ws, adresse de retour OAuth).
server.forward-headers-strategy=framework

# Base PostgreSQL (comptes, curation des personnages). En local : docker compose up -d db
# Ailleurs : SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/blindle
spring.datasource.username=blindle
spring.datasource.password=blindle
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Connexion Google / Discord : un fournisseur sans identifiant est masqué.
blindle.auth.google.client-id=${GOOGLE_CLIENT_ID:}
blindle.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
blindle.auth.discord.client-id=${DISCORD_CLIENT_ID:}
blindle.auth.discord.client-secret=${DISCORD_CLIENT_SECRET:}
# Admins (page des personnages) : e-mails vérifiés ou fournisseur:identifiant, séparés par des virgules.
blindle.admin.emails=${BLINDLE_ADMIN_EMAILS:}
# Sessions en mémoire : un redémarrage déconnecte tout le monde.
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
